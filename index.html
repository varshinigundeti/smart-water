<!DOCTYPE html>
<html>
<head>
    <title>Smart Water Quality Monitoring</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf5ff;
            text-align: center;
            padding: 30px;
        }
        h1 { color: #075985; }
        .card {
            background: white;
            padding: 20px;
            margin: 15px auto;
            border-radius: 12px;
            max-width: 350px;
            box-shadow: 0 2px 8px #bbb;
        }
        .value {
            font-size: 28px;
            color: #0284c7;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Smart Water Purification System</h1>
<p>Water Quality Monitoring Dashboard</p>

<div class="card">
    <h2>pH Value</h2>
    <div class="value">7.00</div>
</div>

<div class="card">
    <h2>TDS Value</h2>
    <div class="value">250 ppm</div>
</div>

<div class="card">
    <h2>Turbidity</h2>
    <div class="value">1800 Raw</div>
</div>

<div class="card">
    <h2>Water Status</h2>
    <div class="value">Within Limits</div>
</div>

<p>Smart Water Quality Monitoring Project</p>

</body>
</html>
